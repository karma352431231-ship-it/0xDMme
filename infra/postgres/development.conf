# PostgreSQL 16; 0xDMme development cluster ONLY, not shared VPS settings.
# Start via pg_ctl -D .local/postgres -o "-c config_file=<absolute path>".
# HBA and identity files remain under PGDATA; no credentials in this file.
listen_addresses = '127.0.0.1'
port = 45432
unix_socket_directories = '/private/tmp'
unix_socket_permissions = 0700
max_connections = 20
shared_buffers = '64MB'
work_mem = '4MB'
maintenance_work_mem = '32MB'
autovacuum = on
track_counts = on
autovacuum_max_workers = 2
autovacuum_work_mem = '16MB'
autovacuum_vacuum_cost_limit = 200
autovacuum_vacuum_cost_delay = '5ms'
fsync = on
full_page_writes = on
synchronous_commit = on
max_wal_size = '512MB'
min_wal_size = '80MB'
checkpoint_completion_target = 0.9
log_statement = 'none'
log_min_error_statement = 'panic'
log_connections = off
log_disconnections = off
# Rotate maintenance-only logs daily; reuse a fixed set of 7 filenames.
logging_collector = on
log_destination = 'stderr'
log_directory = 'maintenance-logs'
log_filename = 'maintenance-%a.log'
log_rotation_age = '1d'
log_rotation_size = 0
log_truncate_on_rotation = on
log_autovacuum_min_duration = '1s'
