# Own PostgreSQL 16 cluster only. Never include in another project's cluster.
# Sized on 09/10/2026 for the VPS (12 vCPU, 31 GB RAM) after the owner removed
# 0xDMme resource caps. The 2 GB data volume, not RAM, bounds WAL and growth.
listen_addresses = '127.0.0.1'
port = 45433
unix_socket_directories = '/run/0xdmme-postgres'
# Web pool 16 + three workers x 4 + work signals + maintenance, with headroom.
max_connections = 64
shared_buffers = '1GB'
effective_cache_size = '8GB'
work_mem = '16MB'
maintenance_work_mem = '256MB'
# Plan §19.2: per-table triggers live in migrations; this is the global budget.
autovacuum = on
autovacuum_max_workers = 4
autovacuum_work_mem = '256MB'
autovacuum_vacuum_cost_limit = 2000
autovacuum_vacuum_cost_delay = '2ms'
autovacuum_naptime = '15s'
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
max_worker_processes = 12
max_parallel_workers = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2
# WAL stays small: it shares the 2 GB volume with objects, backups and releases.
max_wal_size = '256MB'
min_wal_size = '64MB'
wal_keep_size = 0
fsync = on
synchronous_commit = on
full_page_writes = on
password_encryption = 'scram-sha-256'
statement_timeout = '4s'
lock_timeout = '1s'
idle_in_transaction_session_timeout = '2s'
logging_collector = off
log_statement = 'none'
log_min_error_statement = 'panic'
