# Zones belong solely to this site. No changes to global workers, limits or sites.
limit_req_zone $binary_remote_addr zone=xdmme_requests:1m rate=5r/s;
limit_conn_zone $server_name zone=xdmme_connections:32k;

server {
    listen 80;
    server_name 0xdmme.app www.0xdmme.app;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/0xdmme/data/acme;
        default_type text/plain;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location / { return 308 https://0xdmme.app$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.0xdmme.app;
    ssl_certificate /var/lib/0xdmme/data/certificates/live/0xdmme.app/fullchain.pem;
    ssl_certificate_key /var/lib/0xdmme/data/certificates/live/0xdmme.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    return 308 https://0xdmme.app$request_uri;
}

server {
    listen 443 ssl;
    server_name 0xdmme.app;
    ssl_certificate /var/lib/0xdmme/data/certificates/live/0xdmme.app/fullchain.pem;
    ssl_certificate_key /var/lib/0xdmme/data/certificates/live/0xdmme.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache off;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 5m;
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 10s;
    keepalive_timeout 10s;
    limit_req zone=xdmme_requests burst=20 nodelay;
    limit_req_status 429;
    limit_conn xdmme_connections 16;
    limit_conn_status 429;
    limit_rate 256k;
    location / {
        proxy_pass http://unix:/run/0xdmme-web/web.sock;
        proxy_set_header Host 0xdmme.app;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_request_buffering off;
    }
}
