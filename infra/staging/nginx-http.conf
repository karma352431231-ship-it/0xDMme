# Dedicated ACME site only; never default_server or a replacement for existing sites.
server {
    listen 80;
    server_name 0xdmme.app www.0xdmme.app;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/0xdmme/data/acme;
        default_type text/plain;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location / { return 404; }
}
