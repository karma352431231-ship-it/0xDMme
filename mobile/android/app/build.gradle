import com.android.build.api.artifact.SingleArtifact

apply plugin: 'com.android.application'

android {
    namespace = "app.zeroxdmme.development"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.zeroxdmme.development"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Build metadata override for the unchanged-schema native upgrade test.
        versionCode = (project.findProperty('feasibilityVersionCode') ?: '1').toInteger()
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            def fixtureSuffix = project.findProperty('syntheticAppSuffix') ?: (project.findProperty('syntheticPeer') == 'true' ? '.peer' : '')
            if (fixtureSuffix != '') {
                if (!project.hasProperty('syntheticFixtureAssets')) {
                    throw new GradleException('The synthetic peer requires an explicit private test fixture.')
                }
                if (!(fixtureSuffix in ['.peer', '.recovery', '.sender'])) {
                    throw new GradleException('Unknown synthetic test application namespace.')
                }
                applicationIdSuffix fixtureSuffix
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // Explicit debug-only fixture overlay. Normal and release assets never
    // acquire synthetic signers, local trust anchors or endpoint configuration.
    if (project.hasProperty('syntheticFixtureAssets')) {
        def fixture = file(project.property('syntheticFixtureAssets')).canonicalFile
        def privateRoot = new File(rootProject.projectDir, '../../.local').canonicalFile
        if (!fixture.toPath().startsWith(privateRoot.toPath()) || !fixture.isDirectory()) {
            throw new GradleException('Synthetic fixtures must be prepared in the private task directory.')
        }
        sourceSets.debug.assets.srcDir fixture
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    // Independent HTTPS client: never consult Android's global CookieHandler.
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

dependencyLocking {
    lockAllConfigurations()
}

apply from: 'capacitor.build.gradle'
apply from: 'asset-packaging.gradle'
configureExactAssets(SingleArtifact.APK.INSTANCE)

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
