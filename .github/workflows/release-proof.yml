name: Publish authenticated release proof

# Explicit owner invocation only; never activates the VPS or accepts a target URL.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approved:
    if: github.ref == 'refs/heads/main' && github.repository == 'karma352431231-ship-it/0xDMme'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Reuse the deployment's exact-commit CI policy, without private inputs or SSH.
      - run: >-
          PYTHONPATH=infra/staging python3 -c
          'import deploy, os; print(deploy.ci(os.environ["GITHUB_SHA"], "main"))'

  reproduce:
    needs: approved
    uses: ./.github/workflows/release-build.yml

  publish:
    needs: reproduce
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-manifest-*
          path: dist/proofs
      - run: >-
          npm run release:verify -- compare
          dist/proofs/release-manifest-macos-15/release-manifest.json
          dist/proofs/release-manifest-ubuntu-24.04/release-manifest.json
      - id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/proofs/release-manifest-macos-15/release-manifest.json
      # No overwrite option: an existing proof must be inspected before republishing.
      - name: Publish public manifest and signature bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          gh release create "proof-${GITHUB_SHA}" --target "${GITHUB_SHA}" --latest=false \
            --title "Release proof ${GITHUB_SHA}" \
            --notes 'Authenticated source and public-build hashes. This is not a deployment receipt or an E2EE audit.' \
            dist/proofs/release-manifest-macos-15/release-manifest.json \
            "${BUNDLE_PATH}#release-manifest.sigstore.json"
