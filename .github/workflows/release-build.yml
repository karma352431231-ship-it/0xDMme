name: Reproduce public release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run release:build
      - name: Describe public source archive encoding
        run: |
          node --input-type=module - <<'JS'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { gunzipSync } from 'node:zlib';
          const manifest = JSON.parse(await readFile('dist/release/release-manifest.json', 'utf8'));
          const source = manifest.assets.find((entry) => /^\/source-[a-f0-9]{16}\.tar\.gz$/.test(entry.path));
          const content = await readFile('dist/web' + source.path);
          console.log(JSON.stringify({ zlib: process.versions.zlib, header: [...content.subarray(0, 10)], tarSha256: createHash('sha256').update(gunzipSync(content)).digest('hex') }));
          JS
      # Explicit public proof/source files only; never archive a workspace.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest-${{ matrix.os }}
          path: dist/release/release-manifest.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-source-${{ matrix.os }}
          path: dist/web/source-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  compare:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-manifest-*
          path: dist/proofs
      - run: >-
          npm run release:verify -- compare
          dist/proofs/release-manifest-macos-15/release-manifest.json
          dist/proofs/release-manifest-ubuntu-24.04/release-manifest.json
