name: Verificações

# Automatic on main, where deploy requires the exact pushed commit to pass, and
# on pull requests. Task branches run on demand (Actions -> Run workflow, or the
# workflow_dispatch API) so the same commit is not checked twice (17/10/2026).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer run on the same branch or pull request replaces an unfinished one.
# On main each commit gets its own group, so no run there is queued behind or
# cancelled by another: deploy reads the run of its exact commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run probe:zk:prepare
      - run: npm run check

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_USER: hash_talk_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: hash_talk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hash_talk_test -d hash_talk_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run probe:zk:prepare
      # The runtime integration uses local synthetic media only. No executable is bundled/deployed.
      - name: Install synthetic media test runtime
        timeout-minutes: 3
        run: |
          # Azure's mirror stalled package downloads; use the image's official Ubuntu fallbacks.
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          apt_network_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo apt-get "${apt_network_options[@]}" update
          sudo apt-get "${apt_network_options[@]}" install --no-install-recommends -y ffmpeg
      # Node partitions the complete file glob; each shard owns its PostgreSQL
      # service. Serial execution inside a shard preserves schema-test isolation.
      - run: npm run build
      - run: node --env-file-if-exists=.local/web-test.env --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/3 tests/integration/*.test.ts
        env:
          HASH_TALK_MEDIA_FFMPEG: /usr/bin/ffmpeg
          HASH_TALK_MEDIA_FFPROBE: /usr/bin/ffprobe
          HASH_TALK_DATABASE_URL: postgresql://hash_talk_test:synthetic-ci-only@127.0.0.1:5432/hash_talk_test

  reproducible-release:
    uses: ./.github/workflows/release-build.yml
