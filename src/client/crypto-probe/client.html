<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test client · 0xDMme</title>
    <link rel="stylesheet" href="/probe.css" />
    <script type="importmap">
      {{IMPORT_MAP}}
    </script>
    <script type="module" src="/src/client/probe.ts"></script>
  </head>
  <body>
    <main>
      <h1 id="name">Test client</h1>
      <p>Fictional messages only; temporary storage.</p>
      <label for="fingerprint">My public key</label>
      <textarea id="fingerprint" readonly rows="2"></textarea>
      <label for="expected">Other client's public key</label>
      <textarea id="expected" maxlength="43" rows="2"></textarea>
      <button id="confirm" disabled>Check and authorize</button>
      <label for="message">Fictional message</label>
      <textarea id="message" maxlength="1000" rows="3"></textarea>
      <button id="send" disabled>Send encrypted</button>
      <button id="receive" disabled>Search messages</button>
      <button id="revoke" disabled>
        Revoke another device and test rotation
      </button>
      <p id="status" role="status">Starting client…</p>
      <ul id="messages" aria-label="Received messages"></ul>
    </main>
  </body>
</html>
